<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex - Treinador Pokémon</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <section id="screen-login" class="screen active">
    <div class="login-card">
      
      <img src="assets/blastoise.png" alt="Blastoise" class="login-mascot" id="login-mascot">

      
      <h1 class="login-title">
        SEJA BEM VINDO,<br>
        TREINADOR!
      </h1>

      
      <form id="login-form" class="login-form">
        <input 
          type="text" 
          id="login-user" 
          class="login-input" 
          placeholder="login" 
          autocomplete="username"
          required
        >
        <input 
          type="password" 
          id="login-pass" 
          class="login-input" 
          placeholder="senha" 
          autocomplete="current-password"
        >

        
        <button type="submit" id="btn-login-advance" class="login-submit-btn">
          avançar
        </button>

        <button type="button" id="btn-guest" class="link-btn guest-btn">
          entrar como convidado
        </button>
      </form>

      
      <button type="button" id="btn-create-account" class="link-btn create-account-btn">
        criar conta
      </button>
    </div>
  </section>


  
  <section id="screen-create-account" class="screen">
    <div class="create-account-card">
      <img src="assets/blastoise.png" alt="Blastoise" class="login-mascot" id="create-account-mascot">

      <h1 class="create-account-title">
        CRIAR CONTA<br>
        TREINADOR
      </h1>

      <form id="create-account-form" class="create-account-form">
        <input type="text" id="register-name" class="login-input" placeholder="nome" autocomplete="name" required>
        <input type="text" id="register-user" class="login-input" placeholder="login" autocomplete="username" required>
        <input type="password" id="register-pass" class="login-input" placeholder="senha" autocomplete="new-password" required>

        <button type="submit" id="btn-create-user" class="login-submit-btn">
          criar conta
        </button>
      </form>

      <button type="button" id="btn-back-login" class="link-btn create-account-btn">
        voltar para login
      </button>
    </div>
  </section>

  <section id="screen-loading" class="screen">
    <div class="loading-container">
      
      <img src="assets/loading_bg.png" alt="Carregando Pokédex" class="loading-bg-img">

      
      <div class="loading-bar-wrapper">
        <div class="loading-track">
          <div class="loading-fill" id="loading-fill"></div>
          <div class="loading-dot" id="loading-dot"></div>
        </div>
      </div>
    </div>
  </section>


  
  <section id="screen-pokedex" class="screen">
    <div class="pokedex-layout">

      
      <main class="pokedex-device" id="pokedex-device">

        
        <div class="device-top-accent">
          <div class="sensor-dot"></div>
          <div class="sensor-dot"></div>
          <div class="sensor-dot"></div>
        </div>

        
        <div class="panel-left">
          
          
          <div class="pokemon-screen-frame">
            <div class="pokemon-screen" id="pokemon-screen">
              
              
              <span class="pokemon-id" id="pokemon-id">#001</span>

              
              <div class="screen-flower-burst">
                <div class="burst-layer burst-1"></div>
                <div class="burst-layer burst-2"></div>
              </div>

              
              <img 
                src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" 
                alt="Pokémon Sprite" 
                class="pokemon-sprite" 
                id="pokemon-sprite"
              >

              
              <button 
                type="button" 
                class="btn-star-fav" 
                id="btn-toggle-favorite" 
                title="Favoritar Pokémon"
                aria-label="Favoritar Pokémon"
              >
                ★
              </button>
            </div>
          </div>

          
          <div class="pokemon-sub-section">
            
            <div class="abilities-header">
              <span class="pixel-label">HABILIDADES</span>
            </div>
